name: devops-todo

services:
  database:
    build: ./database
    container_name: todo-database
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ./app
    container_name: todo-app
    environment:
      PORT: 3000
      DATABASE_URL: postgres://todo:todo@database:5432/todo
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    build: ./nginx
    container_name: todo-nginx
    depends_on:
      - app
    ports:
      - "80:80"

  jenkins:
    build: ./jenkins
    container_name: todo-jenkins
    privileged: true
    # Host networking: required so Jenkins can reach minikube's API server
    # (minikube --driver=docker listens on 192.168.49.2, unreachable from
    # the compose bridge network). Jenkins UI stays on http://localhost:8080.
    network_mode: host
    environment:
      KUBECONFIG: /kubeconfig/config
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jenkins_home:/var/jenkins_home
      - ./kubeconfig:/kubeconfig:ro

volumes:
  pgdata:
  jenkins_home:
