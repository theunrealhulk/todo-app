<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo App</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 3rem auto; padding: 0 1rem; }
    h1 { font-size: 1.5rem; }
    form { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
    input[type="text"] { flex: 1; padding: .5rem; font-size: 1rem; }
    button { padding: .5rem 1rem; font-size: 1rem; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center;
         padding: .6rem; border-bottom: 1px solid #eee; }
    li .del { border: none; background: none; color: #c00; cursor: pointer; }
    .empty { color: #888; }
  </style>
</head>
<body>
  <h1>Gestion des taches</h1>

  <form id="form">
    <input type="text" id="title" placeholder="Nouvelle tache..." required autofocus>
    <button type="submit">Ajouter</button>
  </form>

  <ul id="list"></ul>
  <p class="empty" id="empty">Aucune tache pour le moment.</p>

  <script>
    const listEl = document.getElementById('list');
    const emptyEl = document.getElementById('empty');

    async function refresh() {
      const res = await fetch('/api/tasks');
      const tasks = await res.json();
      listEl.innerHTML = '';
      emptyEl.style.display = tasks.length ? 'none' : '';
      for (const task of tasks) {
        const li = document.createElement('li');
        const span = document.createElement('span');
        span.textContent = task.title;
        const del = document.createElement('button');
        del.textContent = 'Supprimer';
        del.className = 'del';
        del.onclick = async () => {
          await fetch('/api/tasks/' + task.id, { method: 'DELETE' });
          refresh();
        };
        li.append(span, del);
        listEl.appendChild(li);
      }
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value.trim();
      if (!title) return;
      await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title }),
      });
      document.getElementById('title').value = '';
      refresh();
    });

    refresh();
  </script>
</body>
</html>
